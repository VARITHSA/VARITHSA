<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Srivathsa B S — Software engineer, HPC and quantum computing, founder of LYPTRON">
  <style>
    .sans { font-family: 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .core { fill: #2986FF; opacity: .18; animation: pulse 2.4s ease-in-out infinite; }
    .gcore { fill: #FDAE2B; opacity: .15; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .15 } 50% { opacity: .95 } }
    .pkt { animation: flow 2.6s cubic-bezier(.6,0,.4,1) infinite; }
    .pkt2 { animation: flow 2.6s cubic-bezier(.6,0,.4,1) infinite; animation-delay: 1.3s; }
    @keyframes flow { 0% { transform: translateX(0); opacity: 0 } 10%,85% { opacity: 1 } 100% { transform: translateX(50px); opacity: 0 } }
    .spin { transform-origin: 842px 258px; animation: spin 9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .vec { transform-origin: 842px 258px; animation: precess 5s ease-in-out infinite alternate; }
    @keyframes precess { from { transform: rotate(-35deg) } to { transform: rotate(55deg) } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .rise { animation: rise .9s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#EDF0F5"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#FAFBFD"/><stop offset=".55" stop-color="#FAFBFD" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#FAFBFD"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="18" fill="url(#fade)"/>
